<script>
document.addEventListener('DOMContentLoaded',function(){
  var sb=document.getElementById('mob-sidebar'),ov=document.getElementById('mob-overlay'),tog=document.getElementById('mob-toggle'),cls=document.getElementById('mob-sb-close');
  if(!sb||!ov||!tog) return;
  function openSb(e){e.stopPropagation();e.preventDefault();sb.classList.add('mob-active');ov.classList.add('mob-active');document.body.style.overflow='hidden';}
  function closeSb(){sb.classList.remove('mob-active');ov.classList.remove('mob-active');document.body.style.overflow='';}
  tog.addEventListener('click',openSb,true);
  if(cls) cls.addEventListener('click',closeSb);
  ov.addEventListener('click',closeSb);
  window.mobPanel=function(id){
    closeSb();
    setTimeout(function(){var b=document.querySelector('[data-outside="'+id+'"]');if(b)b.click();},320);
  };
  window.mobMenuBtn=function(btnId){
    closeSb();
    setTimeout(function(){
      var mb=document.getElementById('btn-menu');if(mb)mb.click();
      setTimeout(function(){var t=document.getElementById(btnId);if(t)t.click();},200);
    },320);
  };
});
