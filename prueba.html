<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Radio Player - EXTASSIS NETwork</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            background-color: #000;
        }

        /* Capas de Fondo */
        .bg-layer {
            position: absolute;
            top: -10%; left: -10%; 
            width: 120%; height: 120%;
            background-image: url('https://extassisnetwork.com/archivos/logo1-2.png');
            background-size: cover;
            background-position: center;
            filter: blur(25px) brightness(0.6);
            z-index: -3;
            transition: background-image 1s ease;
        }

        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 3px
            );
            z-index: -2;
            pointer-events: none;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.6) 100%);
            z-index: -1;
            pointer-events: none;
        }

        /* Botones Superiores */
        .top-right-buttons {
            position: absolute;
            top: 30px; right: 40px;
            display: flex;
            gap: 12px;
            z-index: 10;
        }

        .top-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: background 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .top-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .btn-icon {
            width: 36px;
            padding: 0;
            justify-content: center;
        }

        /* Información Superior */
        .top-info {
            text-align: center;
            padding-top: 60px;
            width: 100%;
            z-index: 10;
        }

        .artist {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 400;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }

        .title {
            font-size: 38px;
            color: #fff;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            margin-top: 5px;
            padding: 0 20px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Portada Central */
        .cover-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 30px;
            z-index: 10;
        }

        .cover-container img {
            width: 380px;
            height: 380px;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.5s ease;
        }

        /* Etiqueta En Vivo */
        .badge-container {
            display: flex;
            justify-content: center;
            margin-top: 35px;
            z-index: 10;
        }

        .live-badge {
            background: rgba(255, 60, 60, 0.7);
            color: #fff;
            padding: 8px 24px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(255,0,0,0.3);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2);
            letter-spacing: 1px;
        }

        .dot {
            width: 8px; height: 8px;
            background: #fff;
            border-radius: 50%;
            display: inline-block;
            animation: blink 1.5s infinite;
        }

        @keyframes blink { 
            0%, 100% { opacity: 1; } 
            50% { opacity: 0.3; } 
        }

        /* Controles Inferiores */
        .bottom-controls {
            position: absolute;
            bottom: 0; width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            box-sizing: border-box;
            z-index: 10;
        }

        .powered-by {
            position: absolute;
            left: 40px;
            color: rgba(255,255,255,0.5);
            font-size: 11px;
            letter-spacing: 0.5px;
        }
        
        .powered-by strong {
            color: rgba(255,255,255,0.8);
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .play-btn {
            width: 65px; height: 65px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.4);
            color: #fff;
            cursor: pointer;
            display: flex; 
            justify-content: center; 
            align-items: center;
            backdrop-filter: blur(10px);
            transition: transform 0.2s, background 0.3s;
        }

        .play-btn:hover {
            transform: scale(1.05);
            background: rgba(255,255,255,0.25);
        }

        .play-btn svg {
            fill: #fff;
            width: 24px;
            height: 24px;
            margin-left: 4px; /* Centrar icono de play */
        }
        
        .play-btn.playing svg {
            margin-left: 0; /* Centrar icono de pausa */
        }

        .vol-btn {
            background: none; 
            border: none; 
            color: #fff; 
            cursor: pointer;
            opacity: 0.8;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
        }

        .vol-btn:hover {
            opacity: 1;
        }
        
        .vol-btn svg {
            fill: #fff;
            width: 24px;
            height: 24px;
        }

        @media (max-width: 768px) {
            .cover-container img { width: 280px; height: 280px; }
            .title { font-size: 24px; }
            .artist { font-size: 14px; }
            .powered-by { display: none; }
            .top-right-buttons { top: 20px; right: 20px; }
            .top-btn { padding: 6px 12px; font-size: 10px; }
        }
    </style>
</head>
<body>

    <!-- Fondo -->
    <div id="bg-layer" class="bg-layer"></div>
    <div class="scanlines"></div>
    <div class="overlay"></div>

    <!-- Botones Arriba Derecha -->
    <div class="top-right-buttons">
        <button class="top-btn">TOP 10</button>
        <button class="top-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px;"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            YA SONÓ
        </button>
        <button class="top-btn btn-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
    </div>

    <!-- Info Superior -->
    <div class="top-info">
        <div class="artist" id="artist-name">CONECTANDO...</div>
        <div class="title" id="song-title">ESPERANDO SEÑAL</div>
    </div>

    <!-- Portada -->
    <div class="cover-container">
        <img id="main-cover" src="https://extassisnetwork.com/archivos/logo1-2.png" alt="Portada" />
    </div>

    <!-- Badge En Vivo -->
    <div class="badge-container">
        <div class="live-badge">
            <span class="dot"></span> EN VIVO 24/7 - ON AIR!
        </div>
    </div>

    <!-- Controles Inferiores -->
    <div class="bottom-controls">
        <div class="powered-by">Potenciado por <strong>EXTASSIS NETwork Streaming</strong></div>
        <div class="controls">
            <button class="vol-btn" id="mute-btn">
                <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </button>
            <button class="play-btn" id="play-btn">
                <!-- Icono de Play por defecto -->
                <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <!-- Icono de Pausa oculto -->
                <svg id="icon-pause" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
        </div>
    </div>

    <!-- Elemento de Audio Oculto -->
    <audio id="audio-player" preload="none">
        <source src="https://stream-177.zeno.fm/s8pzao97nbrtv?zt=eyJhbGciOiJIUzI1NiJ9.eyJzdHJlYW0iOiJzOHB6YW85N25icnR2IiwiaG9zdCI6InN0cmVhbS0xNzcuemVuby5mbSIsInJ0dGwiOjUsImp0aSI6Ik8tSEh6dWdxUXNLR0RZeS1JWVRTX3ciLCJpYXQiOjE3ODAyODE5NjEsImV4cCI6MTc4MDI4MjAyMX0.ulhibtSF9uxicGfjCak4oJmyinxw4f2Y_0GTMi-caUQ" type="audio/mpeg">
    </audio>

    <script>
        const DEFAULT_COVER = 'https://extassisnetwork.com/archivos/logo1-2.png'; 
        
        const mainCover = document.getElementById('main-cover');
        const bgLayer = document.getElementById('bg-layer');
        const songTitleEl = document.getElementById('song-title');
        const artistNameEl = document.getElementById('artist-name');
        
        const audioPlayer = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const muteBtn = document.getElementById('mute-btn');
        const iconPlay = document.getElementById('icon-play');
        const iconPause = document.getElementById('icon-pause');
        
        let isPlaying = false;
        let isMuted = false;
        let currentStreamTitle = "";

        // Control de Play / Pausa
        playBtn.addEventListener('click', () => {
            if (audioPlayer.paused) {
                audioPlayer.play();
                isPlaying = true;
                iconPlay.style.display = 'none';
                iconPause.style.display = 'block';
                playBtn.classList.add('playing');
            } else {
                audioPlayer.pause();
                isPlaying = false;
                iconPlay.style.display = 'block';
                iconPause.style.display = 'none';
                playBtn.classList.remove('playing');
            }
        });

        // Control de Mute
        muteBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            audioPlayer.muted = isMuted;
            if (isMuted) {
                muteBtn.style.opacity = '0.4';
            } else {
                muteBtn.style.opacity = '1';
            }
        });

        // Conexión a la API de Zeno.fm
        const zenoMetadataUrl = "https://api.zeno.fm/mounts/metadata/subscribe/s8pzao97nbrtv";
        const evtSource = new EventSource(zenoMetadataUrl);

        evtSource.onmessage = function(event) {
            try {
                const data = JSON.parse(event.data);
                if (data.streamTitle && data.streamTitle !== currentStreamTitle) {
                    currentStreamTitle = data.streamTitle;
                    updatePlayerInfo(currentStreamTitle);
                }
            } catch (err) {
                console.error("Error procesando metadatos:", err);
            }
        };

        evtSource.onerror = function(err) {
            songTitleEl.textContent = "SEÑAL INTERRUMPIDA";
            artistNameEl.textContent = "RECONECTANDO...";
        };

        function setCover(url) {
            mainCover.src = url;
            bgLayer.style.backgroundImage = `url('${url}')`;
        }

        async function updatePlayerInfo(streamTitle) {
            let artist = "EXTASSIS";
            let song = streamTitle;

            if (streamTitle.includes(" - ")) {
                const parts = streamTitle.split(" - ");
                artist = parts[0].trim();
                song = parts.slice(1).join(" - ").trim();
            }

            songTitleEl.textContent = song;
            artistNameEl.textContent = artist;

            if (streamTitle.includes("⏰") || streamTitle.toLowerCase().includes("locución de hora") || streamTitle.toLowerCase().includes("extassis")) {
                setCover(DEFAULT_COVER);
                return;
            }

            try {
                const query = encodeURIComponent(`${artist} ${song}`);
                const itunesUrl = `https://itunes.apple.com/search?term=${query}&entity=song&limit=1`;
                
                const response = await fetch(itunesUrl);
                const data = await response.json();

                if (data.results && data.results.length > 0) {
                    const highResImgUrl = data.results[0].artworkUrl100.replace('100x100bb', '600x600bb');
                    setCover(highResImgUrl);
                } else {
                    setCover(DEFAULT_COVER);
                }
            } catch (error) {
                console.error("Error buscando la portada:", error);
                setCover(DEFAULT_COVER);
            }
        }
    </script>
</body>
</html>
