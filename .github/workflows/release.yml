name: Build Installers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            npm_script: dist:win
          - os: ubuntu-latest
            platform: linux
            npm_script: dist:linux

    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux Dependencies (Ubuntu)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3 \
            make \
            g++ \
            pkg-config \
            fakeroot \
            dpkg \
            libasound2-dev \
            libdbus-1-dev \
            libx11-dev \
            libxkbfile-dev \
            libxi-dev \
            libxtst-dev \
            libudev-dev
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: audio-engine-rust

      - name: Download VC++ 2015-2022 Redistributable (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/vcredist | Out-Null
          $url = "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          $dest = "build/vcredist/vc_redist.x64.exe"
          Write-Host "Descargando $url -> $dest"
          Invoke-WebRequest -Uri $url -OutFile $dest -UseBasicParsing
          $size = (Get-Item $dest).Length
          Write-Host "OK: vc_redist.x64.exe descargado ($size bytes)"
          if ($size -lt 10000000) {
            Write-Error "El archivo descargado es demasiado pequeno ($size bytes). Se esperaban ~25 MB."
            exit 1
          }
          $signature = Get-AuthenticodeSignature $dest
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "Microsoft Corporation") {
            Write-Error "Firma Authenticode invalida para vc_redist.x64.exe: $($signature.Status) $($signature.SignerCertificate.Subject)"
            exit 1
          }

      - name: Install NPM Dependencies
        run: npm ci

      - name: Verify ffmpeg-static SHA-256
        run: npm run verify:ffmpeg-static

      - name: Verify Release Tag Matches Package Version
        if: startsWith(github.ref, 'refs/tags/')
        run: node build/verify-release-tag.js

      - name: Run Node Regression Tests
        run: npm test

      - name: Run Rust Checks
        working-directory: audio-engine-rust
        run: |
          cargo test
          cargo check

      - name: Rebuild Native Node Modules
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Build Electron App (${{ matrix.platform }})
        env:
          CSC_LINK: ${{ matrix.platform == 'win' && startsWith(github.ref, 'refs/tags/') && secrets.WINDOWS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'win' && startsWith(github.ref, 'refs/tags/') && secrets.WINDOWS_CSC_KEY_PASSWORD || '' }}
        run: npm run ${{ matrix.npm_script }}

      - name: Generate Artifact SHA-256
        run: node build/generate-artifact-checksums.js ${{ matrix.platform }}

      - name: Attest Artifact Checksums
        uses: actions/attest@281a49d4cbb0a72c9575a50d18f6deb515a11deb # v4
        with:
          subject-path: dist/SHA256SUMS-${{ matrix.platform }}.txt

      - name: Require Signed Windows Installer For Tags
        if: false
        shell: pwsh
        run: |
          $installers = Get-ChildItem dist -Filter *.exe -File
          if (-not $installers) {
            Write-Error "No se encontro instalador Windows para verificar."
            exit 1
          }
          $expectedThumbprint = "${{ vars.LF_WINDOWS_SIGNER_THUMBPRINT }}".Replace(" ", "").ToUpperInvariant()
          if (-not $expectedThumbprint) {
            Write-Error "Falta configurar vars.LF_WINDOWS_SIGNER_THUMBPRINT."
            exit 1
          }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne "Valid") {
              Write-Error "El instalador no tiene firma Authenticode valida: $($installer.Name) $($signature.Status)"
              exit 1
            }
            $actualThumbprint = ([string]$signature.SignerCertificate.Thumbprint).Replace(" ", "").ToUpperInvariant()
            if ($actualThumbprint -ne $expectedThumbprint) {
              Write-Error "El instalador no fue firmado por el certificado oficial: $($installer.Name)"
              exit 1
            }
          }
        
      - name: Upload Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lf-automatizador-${{ matrix.platform }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.deb
            dist/*.AppImage
            dist/SHA256SUMS-*.txt

      - name: Upload FFmpeg Corresponding Sources
        if: matrix.platform == 'win' && hashFiles('build/compliance/ffmpeg-source-bundle-*.zip') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lf-automatizador-ffmpeg-sources
          path: build/compliance/ffmpeg-source-bundle-*.zip

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download Installer Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Require Corresponding FFmpeg Source Bundle
        if: false
        shell: bash
        run: |
          shopt -s nullglob
          bundles=(release-assets/ffmpeg-source-bundle-*.zip)
          if [ ${#bundles[@]} -ne 1 ]; then
            echo "Se requiere exactamente un build/compliance/ffmpeg-source-bundle-*.zip con las fuentes correspondientes del FFmpeg distribuido."
            exit 1
          fi
          bundle="${bundles[0]}"
          if [ "$(stat -c%s "$bundle")" -lt 1000000 ]; then
            echo "El bundle de fuentes FFmpeg es demasiado pequeno."
            exit 1
          fi
          unzip -t "$bundle"
          unzip -Z1 "$bundle" | grep -qx 'ffmpeg-source-manifest.json'
          export FFMPEG_SOURCE_MANIFEST="$(unzip -p "$bundle" ffmpeg-source-manifest.json)"
          node -e '
            const manifest = JSON.parse(process.env.FFMPEG_SOURCE_MANIFEST);
            const expected = {
              "win32-x64": "04e1307997530f9cf2fe35cba2ca7e8875ca91da02f89d6c7243df819c94ad00",
              "linux-x64": "e7e7fb30477f717e6f55f9180a70386c62677ef8a4d4d1a5d948f4098aa3eb99"
            };
            if (manifest.ffmpegStaticRelease !== "b6.1.1") throw new Error("Release ffmpeg-static incorrecto.");
            if (manifest.includesExternalLibrarySources !== true) throw new Error("Faltan fuentes de bibliotecas externas.");
            for (const [platform, sha256] of Object.entries(expected)) {
              if (manifest.binarySha256?.[platform] !== sha256) throw new Error(`SHA-256 incorrecto para ${platform}.`);
            }
          '
          sha256sum "$bundle" > release-assets/SHA256SUMS-sources.txt

      - name: Attest FFmpeg Source Bundle Checksum
        if: false
        uses: actions/attest@281a49d4cbb0a72c9575a50d18f6deb515a11deb # v4
        with:
          subject-path: release-assets/SHA256SUMS-sources.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: LF Automatizador ${{ github.ref_name }}
          body: Instaladores generados automáticamente por GitHub Actions.
          make_latest: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: false
          files: |
            release-assets/*.exe
            release-assets/*.deb
            release-assets/*.AppImage
            release-assets/SHA256SUMS-*.txt
            release-assets/ffmpeg-source-bundle-*.zip
